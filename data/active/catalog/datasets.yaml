    primary_key: [city_key, grid_id, year]
    coverage: {cities: 22, rows: 211337}
    variants: [nearest_grid, aoi_buffer]
    status: blocked_pending_explicit_variant_policy
  wayback_housing_grid_year_v1:
    layer: label
    path: data/active/labels/housing/historical_snapshot/wayback
    source: internet_archive_wayback
    primary_key: [city_key, grid_id, year]
    coverage: {cities: 42, rows: 11922}
    status: usable_with_caveats
  anjuke_listing_grid_v1:
    layer: label
    path: data/active/labels/housing/listing_price/anjuke
    source: anjuke_cross_section
    primary_key: [city_key, grid_id]
    coverage: {cities: 43, rows: 63997, temporal: cross_section}
    status: complete_cross_section
  causal_response_artifact_v1:
    layer: causal_release
    path: data/active/causal/releases/{release_id}/response_artifact.parquet
    primary_key: [treatment_order, outcome_family, outcome, event_time, specification_id]
    expected_rows_per_treatment: 27
    production_contract:
      treatment_rows: 5048
      outcome_family_tasks: 20192
      immutable_release: true
      source_hashes_required: true
      partial_release_for_training: false
    publisher: scripts/causal_r/build_response_artifact.py
    status: code_complete_awaiting_production_run
  intervention_pretraining_dataset_v1:
    layer: model_input_release
    path: data/model_inputs/{dataset_id}
    primary_unit_key: [treatment_order]
    target_key: [treatment_order, outcome_family, outcome, event_time, specification_id]
    feature_timing: opening_year_minus_1_2_3
    split_unit: city_key
    normalization: fit_train_cities_only
    outputs: [unit_features.parquet, response_targets.parquet, sample_index.parquet, normalization.json, manifest.json]
    publisher: scripts/causal_r/build_pretraining_dataset.py
    status: code_complete_awaiting_response_release
