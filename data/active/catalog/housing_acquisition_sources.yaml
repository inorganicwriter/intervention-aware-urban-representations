    title: Does restricting private school enrollment increase the public school district housing premium? Evidence from the Chengdu real estate market
    url: https://data.mendeley.com/datasets/wpv5zn9rxp/1
    doi: 10.17632/wpv5zn9rxp.1
    license: CC BY 4.0
    access: public_download
    acquired: true
    role: supplemental_monthly_transaction_points
    coverage: Chengdu, 21400 priced records from 2016-07 through 2021-02; community coordinates and month-precision selling time
    limitation: 2230 rows are flagged as duplicate transaction keys and excluded from usable coverage; 317 additional rows lack selling month and price; coordinate CRS is unresolved and blocks 500 m grid assignment

  - source_id: mendeley_52kj9yzx5j_v2
    title: How the rise in commodity house prices curbs the spatial agglomeration of the financial industry in developing countries
    url: https://data.mendeley.com/datasets/52kj9yzx5j/2
    doi: 10.17632/52kj9yzx5j.2
    license: CC BY 4.0
    access: public_download
    acquired: true
    role: early_city_level_auxiliary_growth_rates
    coverage: 182 source cities and 35 research cities, annual observations from 2006 through 2013
    limitation: Contains real housing-price growth rates, not price levels; city level only

  - source_id: mendeley_d6m65pyyxd_v2
    title: "Extrapolative Households and Strategic Firms: Evidence from China's Land and Housing Market"
    url: https://data.mendeley.com/datasets/d6m65pyyxd/2
    doi: 10.17632/d6m65pyyxd.2
    license: CC BY 4.0
    access: public_download
    acquired: true
    role: methodological_benchmark_only
    coverage: Released files contain large anonymized monthly new-house and resale-house panels
    limitation: City mappings, calendar mappings, community names, addresses, and coordinates are absent; the data cannot be assigned to named research cities or 500 m grids

  - source_id: cran_hgwrr_0.6-2
    title: Wuhan Second-hand House Price and POI Data
    url: https://cran.r-project.org/package=hgwrr
    doi: 10.32614/CRAN.package.hgwrr
    license: GPL (>= 2)
    access: public_download
    acquired: true
    role: spatial_cross_section_and_matching_covariate
    coverage: Wuhan, 19599 second-hand property observations at 776 communities in 2018 with coordinates
    limitation: Year-only cross-section; the source does not distinguish completed transactions from listings and cannot serve as a monthly outcome

  - source_id: geodoi_geodb_2018_04_08_v1
    title: Housing Price Quarterly Change Dataset in Nanjing Townhouse Level (2009-2017)
    url: https://www.geodoi.ac.cn/weben/geodoi.aspx?Id=913
    doi: 10.3974/geodb.2018.04.08.V1
    access: public_repository_download
    acquired: true
    role: quarterly_community_outcome_candidate
    coverage: Nanjing, 4560 communities and 150480 community-quarter rows from 2009 Q1 through 2017 Q1; sale price, sale count, rent, and lease count
    limitation: Quarterly rather than monthly; coordinate columns are geographic degrees but the source does not declare the CRS; 8825 low sale-price rows are retained with quality flags

  - source_id: geodoi_geodb_2019_04_17_v1
    title: Housing Price Dataset of Yangtze River Delta Region (2008-2018)
    url: https://www.geodoi.ac.cn/weben/geodoi.aspx?Id=1270
    doi: 10.3974/geodb.2019.04.17.V1
    access: public_repository_download
    acquired: true
    role: annual_city_and_county_auxiliary_panel
    coverage: 41 cities and 327 districts/counties in the Yangtze River Delta, 2008 through 2018; 14 research cities mapped by province-city pair
    limitation: Annual aggregates cannot serve as a monthly 500 m grid outcome

  - source_id: geodoi_geodb_2024_08_07_v1
    title: Spatial Dataset of House Price and Its Influencing Factors in Wuhan City (2019)
    url: https://geodoi.ac.cn/WebCn/geodoi.aspx?Id=3648
    doi: 10.3974/geodb.2024.08.07.V1
    access: public_repository_download
    acquired: true
    role: model_derived_spatial_auxiliary
    coverage: Wuhan, 2019 TD-GNNWR estimated house-price raster and 1 km grid regression coefficients
    limitation: Model predictions and coefficients rather than observed transactions or listings; cross-sectional only

  - source_id: cran_gistools_1.0-2_whdata
    title: Wuhan house-price spatial example data in GISTools
    url: https://cran.r-project.org/package=GISTools
    license: GPL
    access: public_download
    acquired: true
    role: provenance_unresolved_spatial_cross_section
