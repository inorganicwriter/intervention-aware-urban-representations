    access: public_repository_files
    acquired: true
    role: quarantined_listing_snapshot
    coverage: Wuhan, 7609 asking-price rows in two narrow submarkets; 2019 repository snapshot inferred from activity metadata
    limitation: No explicit license, coordinates, or observation dates; narrow nonrepresentative coverage; excluded from formal coverage

