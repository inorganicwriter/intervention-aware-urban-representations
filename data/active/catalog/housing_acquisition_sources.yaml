  - source_id: mendeley_pj2zff4p9m_v4
    title: Dataset on Price and basic information of residential units in Nanning
    url: https://data.mendeley.com/datasets/pj2zff4p9m/4
    doi: 10.17632/pj2zff4p9m.4
    license: CC BY 4.0
    access: public_download
    acquired: true
