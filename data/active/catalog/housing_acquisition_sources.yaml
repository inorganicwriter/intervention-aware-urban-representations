    coverage: Nanning, 2517 residential communities with 2018 average price and coordinates
    limitation: Cross-sectional 2018 listing-based community averages; not a monthly causal outcome

  - source_id: figshare_14398907_v1
    title: Beijing House Price.csv
    url: https://figshare.com/articles/dataset/Beijing_House_Price_csv/14398907
    doi: 10.6084/m9.figshare.14398907.v1
    license: CC BY 4.0
    access: public_download
    acquired: true
    role: supplemental_monthly_transaction_points
    coverage: Beijing, 70843 records from January through September 2020 with coordinates
    limitation: Deal date has month precision only; overlap with purchased Lianjia must be audited before fusion

